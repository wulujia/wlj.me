name: Check site

# Cloudflare Pages builds and serves the site. This workflow only runs the checks
# and a test build, so a failure shows on the commit. It does not deploy.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.159.2
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Check reading pages
        run: |
          python3 -m unittest discover -s tests -p 'test_research*.py'
          python3 scripts/research_tags.py check
          python3 scripts/research_style.py static/research
      - name: Test build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Singapore
        run: |
          hugo \
            --gc \
            --minify
