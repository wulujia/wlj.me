{{- /* The avatar sits outside the logo box, to its left. Inline styles: the theme gives every img a margin, border and padding. */ -}}
<a href="{{ if $.Site.Params.Logo.LogoHomeLink }}{{ $.Site.Params.Logo.LogoHomeLink }}{{else}}{{ $.Site.BaseURL }}{{ end }}" style="display:flex;align-items:center;gap:10px">
  <img class="logo__avatar" src="/avatar.png" alt="Luca 的头像" width="34" height="34" style="display:block;width:34px;height:34px;margin:0;padding:0;border:0;border-radius:50%;flex:0 0 auto">
  <div class="logo">
    {{ with $.Site.Params.Logo.logoText }}{{ . }}{{ else }}Terminal{{ end }}
  </div>
</a>
