{{- $current := .RelPermalink -}}
<nav class="navigation-menu">
  <ul class="navigation-menu__inner menu--desktop">
    {{ range $.Site.Menus.main }}
      {{ if not .HasChildren }}
        {{ $active := and (ne .URL "/") (hasPrefix $current .URL) }}
        <li>
          <a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}{{ if .Params.NewTab }} target="_blank"{{ end }}>{{ .Name }}</a>
        </li>
      {{ end }}
    {{ end }}
  </ul>
</nav>
