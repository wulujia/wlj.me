:root {
  color-scheme: light;
  /* Solarized Light, the same base as the site theme; text is darker for 4.5:1 contrast. */
  --bg: #fdf6e3;
  --surface: #fffcf2;
  --ink: #28383d;
  --ink-2: #45565b;
  --ink-3: #5b6a6e;          --rule: #e6dfca;
  --rule-2: #c8c1ab;
  --mid: #eee8d5;
  --acc: #2aa198;            --acc-ink: #17635d;        --acc-wash: rgba(42, 161, 152, .10);
  --good: #2c7a3a; --warn: #8a5d00; --bad: #b3261e;
  --good-wash: rgba(44,122,58,.10); --warn-wash: rgba(154,106,0,.12); --bad-wash: rgba(179,38,30,.10);
  --font-body: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
  --font-display: var(--font-body);
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #002b36; --surface: #073642; --ink: #d2dbdb; --ink-2: #adbaba; --ink-3: #93a1a1;
    --rule: #0e4250; --rule-2: #2f5d68; --mid: #073642;
    --acc: #2aa198; --acc-ink: #5cc8bf; --acc-wash: rgba(42,161,152,.16);
    --good: #6fc27d; --warn: #e0b34a; --bad: #ef8a83;
    --good-wash: rgba(111,194,125,.14); --warn-wash: rgba(224,179,74,.14); --bad-wash: rgba(239,138,131,.14);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #002b36; --surface: #073642; --ink: #d2dbdb; --ink-2: #adbaba; --ink-3: #93a1a1;
  --rule: #0e4250; --rule-2: #2f5d68; --mid: #073642;
  --acc: #2aa198; --acc-ink: #5cc8bf; --acc-wash: rgba(42,161,152,.16);
  --good: #6fc27d; --warn: #e0b34a; --bad: #ef8a83;
  --good-wash: rgba(111,194,125,.14); --warn-wash: rgba(224,179,74,.14); --bad-wash: rgba(239,138,131,.14);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.8;
  text-autospace: normal; font-kerning: normal; -webkit-font-smoothing: antialiased;
}
a { color: var(--acc-ink); text-decoration: underline; text-underline-offset: .18em; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 6px 10px; }
.skip:focus { left: 8px; z-index: 10; }

.layout { display: grid; grid-template-columns: 220px minmax(0, 720px); gap: 56px; max-width: 1044px; margin: 0 auto; padding: 40px 24px 48px; }
main { min-width: 0; }
.outline { position: sticky; top: 24px; align-self: start; max-height: calc(100vh - 48px); overflow-y: auto; font-size: 13px; line-height: 1.55; }
.outline .label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
.outline ul { list-style: none; margin: 0; padding: 0; }
.outline > ul > li { margin: 0 0 7px; }
.outline > ul > li > a { font-weight: 600; }
.outline ul ul { margin: 3px 0 6px 10px; padding-left: 10px; border-left: 1px solid var(--rule); }
.outline ul ul li { margin: 0 0 2px; }
.outline a { color: var(--ink-2); text-decoration: none; display: block; padding: 1px 0; }
.outline a:hover { color: var(--ink); }
.outline a.active { color: var(--acc-ink); }
.outline summary { display: none; }
@media (min-width: 901px) {
  .outline details > ul { display: block !important; }
}
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; gap: 24px; padding: 28px 18px 72px; }
  .outline { position: static; max-height: none; border: 1px solid var(--rule); padding: 10px 14px; }
  .outline .label { display: none; }
  .outline summary { display: block; cursor: pointer; font-weight: 600; }
  .outline details:not([open]) ul { display: none; }
}

.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.25; letter-spacing: -.01em; margin: 0 0 16px; text-wrap: balance; }
.lede { font-size: 18px; line-height: 1.7; color: var(--ink-2); margin: 0 0 12px; text-wrap: pretty; }
.meta { font-size: 13px; color: var(--ink-3); margin: 0 0 40px; }
.meta span + span::before { content: "·"; margin: 0 8px; }

h2 { font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1.35; margin: 56px 0 14px; padding-top: 20px; border-top: 1px solid var(--rule-2); text-wrap: balance; }
h3 { font-size: 17px; font-weight: 600; margin: 32px 0 10px; }
h4 { font-size: 15px; font-weight: 600; color: var(--ink-2); margin: 24px 0 8px; }
p, li { text-wrap: pretty; }
p { margin: 0 0 1em; }
ul, ol { padding-left: 1.4em; margin: 0 0 1em; }
li { margin: 0 0 .35em; }
strong { font-weight: 600; }
blockquote { margin: 1.2em 0; padding: 0 0 0 1.4em; color: var(--ink-2); }
blockquote cite { display: block; font-size: 13px; color: var(--ink-3); font-style: normal; margin-top: 4px; }
code { font-family: var(--font-mono); font-size: .88em; background: var(--mid); padding: 1px 5px; border-radius: 3px; }
pre { overflow-x: auto; background: var(--mid); padding: 12px 14px; font-size: 13px; line-height: 1.6; margin: 0 0 1.2em; }
pre code { background: none; padding: 0; font-size: inherit; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 40px 0; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }

.summary { border: 1px solid var(--rule-2); background: var(--surface); padding: 18px 20px; margin: 0 0 40px; }
.summary .label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; }
.summary p:last-child { margin: 0; }

.note, .warn, .decision, .todo { border-left: 3px solid var(--rule-2); padding: 10px 16px; margin: 1.2em 0; background: var(--acc-wash); }
.note { border-color: var(--acc); }
.warn { border-color: var(--warn); background: var(--warn-wash); }
.decision { border-color: var(--good); background: var(--good-wash); }
.todo { border-color: var(--bad); background: var(--bad-wash); }
.note b:first-child, .warn b:first-child, .decision b:first-child, .todo b:first-child { margin-right: .5em; }
.note p:last-child, .warn p:last-child, .decision p:last-child, .todo p:last-child { margin: 0; }

.tbl { overflow-x: auto; margin: 0 0 1.4em; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.55; }
caption { text-align: left; font-weight: 600; padding: 0 0 8px; }
th, td { text-align: left; vertical-align: top; padding: 9px 12px 9px 0; border-bottom: 1px solid var(--rule); }
th { font-size: 12.5px; letter-spacing: .04em; color: var(--ink-3); font-weight: 500; border-bottom: 1px solid var(--rule-2); }
th[scope="row"] { font-weight: 600; color: var(--ink); font-size: inherit; letter-spacing: 0; border-bottom: 1px solid var(--rule); }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
tfoot td { border-bottom: 0; border-top: 1px solid var(--rule-2); font-weight: 600; }
.compare th.pick { background: var(--acc-wash); color: var(--acc-ink); }
.compare td.pick { background: var(--acc-wash); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--rule-2); border: 1px solid var(--rule-2); margin: 0 0 1.6em; }
.stats > div { background: var(--surface); padding: 12px 14px; }
.stats b { display: block; font-family: var(--font-mono); font-size: 22px; font-weight: 500; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stats span { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
.stats i { font-style: normal; font-size: 12.5px; color: var(--ink-2); }

.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; font-size: 14.5px; margin: 0 0 1.4em; }
.kv dt { color: var(--ink-3); margin: 0; }
.kv dd { margin: 0; overflow-wrap: anywhere; }

.timeline { list-style: none; padding: 0; margin: 0 0 1.6em; border-left: 1px solid var(--rule-2); }
.timeline li { display: grid; grid-template-columns: 7ch 1fr; gap: 14px; padding: 0 0 14px 18px; position: relative; margin: 0; }
.timeline li::before { content: ""; position: absolute; left: -4px; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: var(--acc); }
.timeline time { font-family: var(--font-mono); font-size: 13px; color: var(--ink-3); }

figure { margin: 1.6em 0; }
figure svg { width: 100%; height: auto; display: block; color: var(--ink); }
figcaption { font-size: 13px; color: var(--ink-3); margin-top: 8px; line-height: 1.6; }
figure details { font-size: 13.5px; margin-top: 6px; }
figure summary { cursor: pointer; color: var(--ink-3); }

.pill { display: inline-block; font-size: 12px; font-weight: 600; line-height: 1.6; padding: 0 8px; border-radius: 3px; background: var(--acc-wash); color: var(--acc-ink); box-shadow: inset 0 0 0 1px var(--acc); vertical-align: middle; }
.pill.good { background: var(--good-wash); color: var(--good); box-shadow: inset 0 0 0 1px var(--good); }
.pill.warn { background: var(--warn-wash); color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }
.pill.bad { background: var(--bad-wash); color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }

.sources { font-size: 14px; color: var(--ink-2); }
.sources li { margin: 0 0 .5em; word-break: break-word; }
sup a { text-decoration: none; font-family: var(--font-mono); font-size: 11px; }

@page { size: A4; margin: 20mm 22mm 22mm; @bottom-center { content: counter(page); font-size: 9pt; color: #555; } }
@media print {
  :root, :root[data-theme="dark"] { color-scheme: light; --bg: #fff; --surface: #fff; --ink: #000; --ink-2: #222; --ink-3: #555; --rule: #bbb; --rule-2: #888; --mid: #f0f0f0; --acc-wash: #f2f2f2; }
  html { font-size: 11pt; }

  td { border-bottom-width: .25pt; }

  .layout { display: block; max-width: none; padding: 0; }
  .outline, .skip { display: none; }
  h1, h2, h3, h4 { break-after: avoid; }

  p, li { orphans: 3; widows: 3; }

  tr { break-inside: avoid; }
  a { color: #000; }
  .sources a[href^="http"]::after, p a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 85%; color: #555; }
  *, *::before, *::after { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* Shared controls and narrow-screen safeguards. */
body { overflow-wrap: anywhere; }
main img { max-width: 100%; height: auto; }
main iframe, main video { max-width: 100%; }

/* Site header and footer: the same logo bar, menu and footer as the Hugo theme. */
/* Fira Code is the site font; the files come from the theme at /fonts/. Chinese text falls back to system fonts. */
@font-face { font-family: 'Fira Code'; font-style: normal; font-weight: 300 700; font-display: swap; src: url("/fonts/FiraCode-Latin.woff2") format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
.site-header, .site-footer { font-family: "Fira Code", var(--font-mono); max-width: 1044px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }

.site-logo-bar a { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; text-decoration: none; }

.site-footer { padding-top: 24px; padding-bottom: 40px; text-align: center; font-size: 13px; color: var(--ink-3); }
.site-footer a { color: inherit; }
.theme-toggle { background: none; border: 0; padding: 0; color: inherit; font: inherit; font-weight: bold; cursor: pointer; }
.theme-toggle:hover { color: var(--acc-ink); }
@media (max-width: 900px) { .site-header { padding-top: 24px; padding-left: 18px; padding-right: 18px; } }

@media (max-width: 900px) {
  h1 { font-size: 28px; }
  .outline details[open] > ul { max-height: 55vh; overflow-y: auto; margin-top: 12px; }

}
@media print {
  :root:not([data-theme="light"]) { color-scheme: light; --bg: #fff; --surface: #fff; --ink: #000; --ink-2: #222; --ink-3: #555; --rule: #bbb; --rule-2: #888; --mid: #f0f0f0; --acc: #222; --acc-ink: #222; --acc-wash: #f2f2f2; }
  .reading-toolbar, .site-header, .site-footer { display: none; }
  .tbl, pre { overflow: visible; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; }

<script id="reading-script">
// The complete document remains visible without JavaScript.
(function () {
  const root = document.documentElement;
  // Same theme switch as the Hugo pages: one saved choice in localStorage "theme".
  const saved = localStorage.getItem('theme');
  if (saved) root.setAttribute('data-theme', saved);
  const toggle = document.getElementById('theme-toggle');
  if (toggle) {
    toggle.addEventListener('click', function () {
      const current = root.getAttribute('data-theme');
      const dark = current === 'dark' || (!current && !window.matchMedia('(prefers-color-scheme: light)').matches);
      const next = dark ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  }
  const outline = document.querySelector('.outline details');
  const mobile = window.matchMedia('(max-width: 900px)');
  function resize() {
    if (outline) outline.open = !mobile.matches;
  }
  resize();
  mobile.addEventListener('change', resize);
  const links = Array.from(document.querySelectorAll('.outline a[href^="#"]'));
  const targets = links.map(function (link) {
    return document.getElementById(decodeURIComponent(link.hash.slice(1)));
  }).filter(Boolean);
  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        links.forEach(function (link) {
          const active = decodeURIComponent(link.hash.slice(1)) === entry.target.id;
          link.classList.toggle('active', active);
          if (active) link.setAttribute('aria-current', 'location');
          else link.removeAttribute('aria-current');
        });
      });
    }, { rootMargin: '0px 0px -75% 0px', threshold: 0 });
    targets.forEach(function (target) { observer.observe(target); });
  }
})();
</script>
